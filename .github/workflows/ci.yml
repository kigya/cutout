name: Cutout CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, tests, dependency and publication checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 22.23.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Run local quality checks
        run: scripts/check-local.sh --skip-security

      - name: Preserve JavaScript coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-coverage
          path: coverage/coverage-summary.json
          retention-days: 7

  security:
    name: Secrets and workflow security scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks 8.30.1 and verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan history and worktree for secrets
        run: gitleaks git . --redact --no-banner

      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          persona: auditor
          advanced-security: false
          annotations: false

  android:
    name: Android tests, coverage report and release/R8
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 22.23.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Install JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the exact Android compile toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006'

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run native tests, report coverage and build optimized release
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :app:nativeCoverageReport :app:assembleRelease

      - name: Scan mobile source and effective Android permissions
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          python3 -m venv /tmp/cutout-mobile-sast
          /tmp/cutout-mobile-sast/bin/pip install mobsfscan==1.0.1
          /tmp/cutout-mobile-sast/bin/mobsfscan --json --type android -o /tmp/cutout-android-sast.json app/src/main/java app/src/main/res app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          /tmp/cutout-mobile-sast/bin/mobsfscan --json --type ios -o /tmp/cutout-ios-sast.json ios/Cutout
          python3 scripts/check-mobile-sast.py --manifest app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml /tmp/cutout-android-sast.json /tmp/cutout-ios-sast.json

      - name: Record release build checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Preserve native and security verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-security-evidence
          path: |
            app/build/reports/jacoco/nativeCoverageReport/nativeCoverageReport.xml
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/apk/release/app-release.apk.sha256
            /tmp/cutout-android-sast.json
            /tmp/cutout-ios-sast.json
          retention-days: 7

  ios:
    name: iOS unsigned Release build
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select pinned Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install Node.js 22.23.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install locked CocoaPods toolchain
        run: bundle install --jobs 4 --retry 3

      - name: Install iOS dependencies
        run: bundle exec pod install --project-directory=ios

      - name: Build unsigned iOS Release
        run: xcodebuild -workspace ios/Cutout.xcworkspace -scheme Cutout -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

  codeql:
    name: Optional public-repository CodeQL scan
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # CodeQL uploads SARIF findings for this public repository.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL for JavaScript and TypeScript
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
